services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_dbms_security_auth__enabled: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - neo4j
    environment:
      NEO4J_URI: ${NEO4J_URI:-neo4j://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      VIEWER_API_KEY: ${VIEWER_API_KEY:-}
      ANALYST_API_KEY: ${ANALYST_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SUPER_ADMIN_API_KEY: ${SUPER_ADMIN_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      EBAY_BROWSE_TOKEN: ${EBAY_BROWSE_TOKEN:-}
      BESTBUY_API_KEY: ${BESTBUY_API_KEY:-}
      AMAZON_PAAPI_ACCESS_KEY: ${AMAZON_PAAPI_ACCESS_KEY:-}
      AMAZON_PAAPI_SECRET_KEY: ${AMAZON_PAAPI_SECRET_KEY:-}
      AMAZON_PAAPI_PARTNER_TAG: ${AMAZON_PAAPI_PARTNER_TAG:-}
      AUTONOMOUS_AGENTS_ENABLED: ${AUTONOMOUS_AGENTS_ENABLED:-true}
      AUTONOMOUS_AGENT_INTERVAL_SECONDS: ${AUTONOMOUS_AGENT_INTERVAL_SECONDS:-900}
      AUTONOMOUS_AGENT_MAX_PRODUCTS: ${AUTONOMOUS_AGENT_MAX_PRODUCTS:-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  neo4j_data:
  neo4j_logs:
