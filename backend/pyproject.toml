[project]
name = "pc-compatibility-intelligence-backend"
version = "0.1.0"
description = "FastAPI and Neo4j backend for an engineering-grade custom PC compatibility simulator."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "neo4j>=5.20",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "numpy>=1.26",
  "pydantic>=2.6",
  "uvicorn>=0.29",
  "psycopg2-binary>=2.9"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
image = ["pillow>=10.0", "rembg>=2.0", "boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
