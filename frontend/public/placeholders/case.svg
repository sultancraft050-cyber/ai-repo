<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="12"/>
  <!-- Case body -->
  <rect x="80" y="90" width="190" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Front panel -->
  <rect x="85" y="95" width="100" height="230" rx="5" fill="#0f172a"/>
  <!-- Mesh area -->
  <g stroke="#1e293b" stroke-width="1">
    <rect x="90" y="105" width="88" height="100" rx="3" fill="#111827" stroke="#374151" stroke-width="0.5"/>
    <!-- Mesh pattern -->
    <g stroke="#374151" stroke-width="0.5">
      <line x1="96" y1="105" x2="96" y2="205"/>
      <line x1="104" y1="105" x2="104" y2="205"/>
      <line x1="112" y1="105" x2="112" y2="205"/>
      <line x1="120" y1="105" x2="120" y2="205"/>
      <line x1="128" y1="105" x2="128" y2="205"/>
      <line x1="136" y1="105" x2="136" y2="205"/>
      <line x1="144" y1="105" x2="144" y2="205"/>
      <line x1="152" y1="105" x2="152" y2="205"/>
      <line x1="160" y1="105" x2="160" y2="205"/>
      <line x1="168" y1="105" x2="168" y2="205"/>
      <line x1="90" y1="112" x2="178" y2="112"/>
      <line x1="90" y1="120" x2="178" y2="120"/>
      <line x1="90" y1="128" x2="178" y2="128"/>
      <line x1="90" y1="136" x2="178" y2="136"/>
      <line x1="90" y1="144" x2="178" y2="144"/>
      <line x1="90" y1="152" x2="178" y2="152"/>
      <line x1="90" y1="160" x2="178" y2="160"/>
      <line x1="90" y1="168" x2="178" y2="168"/>
      <line x1="90" y1="176" x2="178" y2="176"/>
      <line x1="90" y1="184" x2="178" y2="184"/>
      <line x1="90" y1="192" x2="178" y2="192"/>
      <line x1="90" y1="200" x2="178" y2="200"/>
    </g>
  </g>
  <!-- Power button -->
  <circle cx="134" cy="230" r="10" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="134" cy="230" r="4" fill="#3b82f6"/>
  <!-- USB ports -->
  <g fill="#1e293b" stroke="#475569" stroke-width="0.5">
    <rect x="100" y="250" width="14" height="8" rx="1"/>
    <rect x="118" y="250" width="14" height="8" rx="1"/>
  </g>
  <!-- 3.5mm jack -->
  <circle cx="145" cy="254" r="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <!-- Side panel (glass) -->
  <rect x="268" y="95" width="5" height="230" rx="2" fill="#1e40af" opacity="0.4"/>
  <text x="200" y="360" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">CASE</text>
</svg>
