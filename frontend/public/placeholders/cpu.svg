<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="12"/>
  <!-- CPU die -->
  <rect x="140" y="140" width="120" height="120" rx="8" fill="url(#chip)"/>
  <!-- CPU pins -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <line x1="155" y1="135" x2="155" y2="115"/>
    <line x1="175" y1="135" x2="175" y2="115"/>
    <line x1="195" y1="135" x2="195" y2="115"/>
    <line x1="215" y1="135" x2="215" y2="115"/>
    <line x1="235" y1="135" x2="235" y2="115"/>
    <line x1="155" y1="265" x2="155" y2="285"/>
    <line x1="175" y1="265" x2="175" y2="285"/>
    <line x1="195" y1="265" x2="195" y2="285"/>
    <line x1="215" y1="265" x2="215" y2="285"/>
    <line x1="235" y1="265" x2="235" y2="285"/>
    <line x1="135" y1="155" x2="115" y2="155"/>
    <line x1="135" y1="175" x2="115" y2="175"/>
    <line x1="135" y1="195" x2="115" y2="195"/>
    <line x1="135" y1="215" x2="115" y2="215"/>
    <line x1="135" y1="235" x2="115" y2="235"/>
    <line x1="265" y1="155" x2="285" y2="155"/>
    <line x1="265" y1="175" x2="285" y2="175"/>
    <line x1="265" y1="195" x2="285" y2="195"/>
    <line x1="265" y1="215" x2="285" y2="215"/>
    <line x1="265" y1="235" x2="285" y2="235"/>
  </g>
  <!-- Core grid -->
  <g fill="#93c5fd" opacity="0.3">
    <rect x="152" y="152" width="36" height="36" rx="3"/>
    <rect x="196" y="152" width="36" height="36" rx="3"/>
    <rect x="152" y="196" width="36" height="36" rx="3"/>
    <rect x="196" y="196" width="36" height="36" rx="3"/>
  </g>
  <text x="200" y="340" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">CPU</text>
</svg>
