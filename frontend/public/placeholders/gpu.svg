<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="heatsink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="12"/>
  <!-- PCB -->
  <rect x="60" y="130" width="280" height="140" rx="6" fill="url(#card)" opacity="0.9"/>
  <!-- Heatsink fins -->
  <g fill="url(#heatsink)" stroke="#64748b" stroke-width="0.5">
    <rect x="75" y="100" width="18" height="75" rx="2"/>
    <rect x="98" y="100" width="18" height="75" rx="2"/>
    <rect x="121" y="100" width="18" height="75" rx="2"/>
    <rect x="144" y="100" width="18" height="75" rx="2"/>
    <rect x="167" y="100" width="18" height="75" rx="2"/>
    <rect x="190" y="100" width="18" height="75" rx="2"/>
    <rect x="213" y="100" width="18" height="75" rx="2"/>
    <rect x="236" y="100" width="18" height="75" rx="2"/>
    <rect x="259" y="100" width="18" height="75" rx="2"/>
    <rect x="282" y="100" width="18" height="75" rx="2"/>
    <rect x="305" y="100" width="18" height="75" rx="2"/>
  </g>
  <!-- Heatsink base -->
  <rect x="70" y="170" width="260" height="15" rx="2" fill="#334155"/>
  <!-- Display output ports -->
  <g fill="#1e293b" stroke="#94a3b8" stroke-width="1">
    <rect x="75" y="245" width="28" height="18" rx="2"/>
    <rect x="108" y="245" width="28" height="18" rx="2"/>
    <rect x="141" y="245" width="20" height="18" rx="2"/>
    <rect x="166" y="245" width="20" height="18" rx="2"/>
  </g>
  <!-- Gold PCIe fingers -->
  <g fill="#fbbf24">
    <rect x="70" y="265" width="260" height="4" rx="1"/>
  </g>
  <!-- GPU die label -->
  <text x="265" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle" font-weight="600">GPU</text>
  <text x="200" y="340" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">GPU</text>
</svg>
