<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="12"/>
  <!-- PSU box -->
  <rect x="80" y="120" width="240" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Vent grill -->
  <g stroke="#475569" stroke-width="1.5" stroke-linecap="round">
    <line x1="95" y1="140" x2="95" y2="260"/>
    <line x1="110" y1="140" x2="110" y2="260"/>
    <line x1="125" y1="140" x2="125" y2="260"/>
    <line x1="140" y1="140" x2="140" y2="260"/>
    <line x1="155" y1="140" x2="155" y2="260"/>
    <line x1="170" y1="140" x2="170" y2="260"/>
    <line x1="185" y1="140" x2="185" y2="260"/>
  </g>
  <!-- Power rating label area -->
  <rect x="200" y="135" width="105" height="130" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <!-- Rating text -->
  <text x="252" y="175" font-family="Inter,system-ui,sans-serif" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="700">850W</text>
  <text x="252" y="200" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#4ade80" text-anchor="middle">80+ GOLD</text>
  <!-- Modular connectors -->
  <g fill="#334155" stroke="#475569" stroke-width="1">
    <rect x="207" y="215" width="22" height="12" rx="2"/>
    <rect x="234" y="215" width="22" height="12" rx="2"/>
    <rect x="261" y="215" width="22" height="12" rx="2"/>
												  <rect x="207" y="233" width="22" height="12" rx="2"/>
    <rect x="234" y="233" width="22" height="12" rx="2"/>
    <rect x="261" y="233" width="22" height="12" rx="2"/>
  </g>
  <!-- Power switch -->
  <circle cx="130" cy="300" r="12" fill="none" stroke="#ef4444" stroke-width="2"/>
  <line x1="130" y1="292" x2="130" y2="300" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <text x="200" y="355" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">PSU</text>
</svg>
