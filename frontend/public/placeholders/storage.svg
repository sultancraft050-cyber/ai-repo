<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="12"/>
  <!-- NVMe SSD -->
  <g>
    <!-- PCB -->
    <rect x="100" y="155" width="200" height="80" rx="5" fill="#166534" stroke="#15803d" stroke-width="1.5"/>
    <!-- NAND chip -->
    <rect x="115" y="165" width="55" height="45" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="142" y="192" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">NAND</text>
    <!-- Controller chip -->
    <rect x="185" y="167" width="40" height="40" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="205" y="191" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#64748b" text-anchor="middle">CTRL</text>
    <!-- M.2 notch -->
    <rect x="100" y="186" width="8" height="12" rx="1" fill="#0f172a"/>
    <!-- Gold contacts -->
    <g fill="#fbbf24">
      <rect x="108" y="229" width="6" height="5" rx="0.5"/>
      <rect x="120" y="229" width="6" height="5" rx="0.5"/>
      <rect x="132" y="229" width="6" height="5" rx="0.5"/>
      <rect x="144" y="229" width="6" height="5" rx="0.5"/>
      <rect x="156" y="229" width="6" height="5" rx="0.5"/>
      <rect x="168" y="229" width="6" height="5" rx="0.5"/>
      <rect x="180" y="229" width="6" height="5" rx="0.5"/>
      <rect x="192" y="229" width="6" height="5" rx="0.5"/>
      <rect x="204" y="229" width="6" height="5" rx="0.5"/>
      <rect x="216" y="229" width="6" height="5" rx="0.5"/>
      <rect x="228" y="229" width="6" height="5" rx="0.5"/>
      <rect x="240" y="229" width="6" height="5" rx="0.5"/>
      <rect x="252" y="229" width="6" height="5" rx="0.5"/>
      <rect x="264" y="229" width="6" height="5" rx="0.5"/>
      <rect x="276" y="229" width="6" height="5" rx="0.5"/>
      <rect x="288" y="229" width="6" height="5" rx="0.5"/>
    </g>
    <!-- Speed label -->
    <text x="240" y="200" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#4ade80" text-anchor="start">NVMe</text>
  </g>
  <text x="200" y="340" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">STORAGE</text>
</svg>
